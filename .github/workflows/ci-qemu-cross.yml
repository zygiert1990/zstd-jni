name: "CI qemu cross"
on: [push, pull_request]
# The most expensive job in the repo, and until now the only workflow without a
# concurrency group - so a push superseded by another one kept its s390x run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    qemu-cross:
        strategy:
            # One slow guest should not cancel the others.
            fail-fast: false
            matrix:
                include: [
                    { platform: linux/s390x, image: "s390x/eclipse-temurin:25-jdk-noble", build_script: "build-s390x.sh" },
                    # ARMv7 keeps the 32-bit ABI coverage (including 4-byte size_t)
                    # while Liberica supplies a JIT. Its matching fallback linker
                    # is compiled in the guest because the JDK does not ship it.
                    { platform: linux/arm/v7, image: "debian:bookworm-slim", build_script: "build-armv7.sh" }
                ]
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: docker/setup-qemu-action@v4

        - name: ${{ matrix.platform }} build and test
          uses: ./.github/actions/qemu-cross
          with:
            platform: ${{ matrix.platform }}
            image: ${{ matrix.image }}
            build-script: ${{ matrix.build_script }}
